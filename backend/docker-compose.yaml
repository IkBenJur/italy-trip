services:
  postgres:
    image: postgres:16-alpine
    container_name: italy-trip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: italy-trip
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Stands in for the Railway Storage Bucket locally. Production talks to the
  # real bucket through the same AWS_* variables, so nothing in the app knows
  # the difference.
  minio:
    image: quay.io/minio/minio:latest
    container_name: italy-trip-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket on first run and leaves it private, matching Railway.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: italy-trip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/italy-trip &&
             mc anonymous set none local/italy-trip"

volumes:
  postgres-data:
  minio-data:
